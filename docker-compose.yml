services:
  teaoh:
    build: .
    ports:
      - "${TEAOH_TCP_PORT:-8078}:8078"
      - "${TEAOH_WS_PORT:-8079}:8079"
      - "127.0.0.1:${TEAOH_ADMIN_PORT:-8080}:8080"
    environment:
      TEAOH_DATABASE_DRIVER: postgres
      TEAOH_DATABASE_HOST: db
      TEAOH_DATABASE_PORT: 5432
      TEAOH_DATABASE_NAME: ${TEAOH_DB_NAME:-teaoh}
      TEAOH_DATABASE_USER: ${TEAOH_DB_USER:-teaoh}
      TEAOH_DATABASE_PASSWORD: ${TEAOH_DB_PASSWORD:-teaoh}
      TEAOH_ADMIN_HOST: 0.0.0.0
      TEAOH_ADMIN_KEY:
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    ports:
      - "127.0.0.1:${TEAOH_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${TEAOH_DB_NAME:-teaoh}
      POSTGRES_USER: ${TEAOH_DB_USER:-teaoh}
      POSTGRES_PASSWORD: ${TEAOH_DB_PASSWORD:-teaoh}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
